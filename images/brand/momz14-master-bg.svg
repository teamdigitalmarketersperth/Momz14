<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1440" width="2560" height="1440" preserveAspectRatio="xMidYMid slice">
  <defs>
    <!-- Deep Space Celestial Gradient -->
    <radialGradient id="nebula1" cx="75%" cy="25%" r="55%" fx="70%" fy="20%">
      <stop offset="0%" stop-color="#4E9BDE" stop-opacity="0.14"/>
      <stop offset="45%" stop-color="#243b55" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#08080A" stop-opacity="0"/>
    </radialGradient>

    <!-- Warm Modular Synthesizer Voltage Glow -->
    <radialGradient id="nebula2" cx="20%" cy="75%" r="60%" fx="25%" fy="70%">
      <stop offset="0%" stop-color="#E5A93C" stop-opacity="0.11"/>
      <stop offset="50%" stop-color="#553818" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#08080A" stop-opacity="0"/>
    </radialGradient>

    <!-- Subtle Deep Horizon Accent -->
    <radialGradient id="nebula3" cx="50%" cy="50%" r="40%">
      <stop offset="0%" stop-color="#1A1C24" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#08080A" stop-opacity="0"/>
    </radialGradient>

    <!-- Modular Voltage Wave Grid Pattern -->
    <pattern id="soundfield-grid" width="120" height="120" patternUnits="userSpaceOnUse">
      <path d="M 120 0 L 0 0 0 120" fill="none" stroke="#2A2D38" stroke-width="0.75" stroke-opacity="0.25"/>
      <circle cx="0" cy="0" r="1.5" fill="#E5A93C" fill-opacity="0.35"/>
    </pattern>

    <!-- Filter for Stardust Glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Deep Obsidian Void Base -->
  <rect width="2560" height="1440" fill="#08080A"/>

  <!-- Cosmic Ambient Nebulae (MoM-z14 Horizon) -->
  <rect width="2560" height="1440" fill="url(#nebula1)"/>
  <rect width="2560" height="1440" fill="url(#nebula2)"/>
  <rect width="2560" height="1440" fill="url(#nebula3)"/>

  <!-- Modular Sound Field Coordinate Grid -->
  <rect width="2560" height="1440" fill="url(#soundfield-grid)"/>

  <!-- Synthesizer Harmonic Waveforms (Cinematic Sound Waves) -->
  <g opacity="0.35">
    <!-- Fundamental Sine Frequency Curve -->
    <path d="M -100 720 Q 300 520, 700 720 T 1500 720 T 2300 720 T 2700 720" fill="none" stroke="#4E9BDE" stroke-width="1.5" stroke-opacity="0.4"/>
    
    <!-- Complex Harmonic Overtone Curve (Sawtooth / Modular Attenuation) -->
    <path d="M -100 840 Q 400 960, 900 800 T 1800 860 T 2700 780" fill="none" stroke="#E5A93C" stroke-width="1.2" stroke-opacity="0.35"/>
    
    <!-- Sub-Bass Low Frequency Wave -->
    <path d="M -100 450 C 500 320, 1100 620, 1700 480 C 2100 380, 2450 560, 2700 500" fill="none" stroke="#FFFFFF" stroke-width="0.8" stroke-opacity="0.2"/>
  </g>

  <!-- Distant Galaxy MoM-z14 Micro-Starlight Field -->
  <g fill="#FFFFFF">
    <circle cx="340" cy="180" r="1.2" opacity="0.6"/>
    <circle cx="520" cy="310" r="0.8" opacity="0.4"/>
    <circle cx="780" cy="140" r="1.5" opacity="0.7" filter="url(#glow)"/>
    <circle cx="940" cy="270" r="0.9" opacity="0.5"/>
    <circle cx="1180" cy="190" r="1.8" opacity="0.8" filter="url(#glow)"/>
    <circle cx="1420" cy="340" r="1.0" opacity="0.4"/>
    <circle cx="1680" cy="160" r="1.4" opacity="0.6"/>
    <circle cx="1920" cy="290" r="2.0" opacity="0.9" filter="url(#glow)"/>
    <circle cx="2140" cy="170" r="1.1" opacity="0.5"/>
    <circle cx="2380" cy="320" r="1.6" opacity="0.7"/>

    <circle cx="210" cy="980" r="1.0" opacity="0.4"/>
    <circle cx="480" cy="1120" r="1.5" opacity="0.6"/>
    <circle cx="820" cy="1240" r="0.8" opacity="0.3"/>
    <circle cx="1120" cy="1080" r="1.6" opacity="0.7"/>
    <circle cx="1480" cy="1290" r="1.2" opacity="0.5"/>
    <circle cx="1780" cy="1140" r="1.9" opacity="0.8" filter="url(#glow)"/>
    <circle cx="2080" cy="1260" r="0.9" opacity="0.4"/>
    <circle cx="2340" cy="1050" r="1.4" opacity="0.6"/>
  </g>

  <!-- Golden Galaxy Core Node (The Genesis Point) -->
  <g transform="translate(1920, 290)">
    <circle cx="0" cy="0" r="18" fill="#E5A93C" fill-opacity="0.08"/>
    <circle cx="0" cy="0" r="8" fill="#E5A93C" fill-opacity="0.2"/>
    <circle cx="0" cy="0" r="2.5" fill="#FFFFFF"/>
    <line x1="-25" y1="0" x2="25" y2="0" stroke="#E5A93C" stroke-width="0.5" stroke-opacity="0.5"/>
    <line x1="0" y1="-25" x2="0" y2="25" stroke="#E5A93C" stroke-width="0.5" stroke-opacity="0.5"/>
  </g>
</svg>
