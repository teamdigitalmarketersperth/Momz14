<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 60" width="320" height="60" fill="none">
  <!-- MOMZ14 Bespoke Architectural Brand Mark -->
  <style>
    .brand-text {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 32px;
      fill: #FFFFFF;
      letter-spacing: 0.16em;
    }
    .brand-accent {
      fill: #E5A93C;
    }
    .brand-sub {
      font-family: 'Space Mono', monospace;
      font-size: 8px;
      fill: #8E929D;
      letter-spacing: 0.32em;
    }
    .signal-line {
      stroke: #2A2D35;
      stroke-width: 1;
    }
    .pulse-node {
      fill: #E5A93C;
    }
  </style>
  
  <!-- Subtle Modular Connection Node Graphic -->
  <g transform="translate(4, 12)">
    <circle cx="10" cy="18" r="7" stroke="#E5A93C" stroke-width="1.5" fill="#121316"/>
    <circle cx="10" cy="18" r="3" class="pulse-node"/>
    <line x1="17" y1="18" x2="30" y2="18" stroke="#E5A93C" stroke-width="1.5"/>
    <circle cx="30" cy="18" r="2" fill="#FFFFFF"/>
  </g>

  <!-- MOMZ14 Typographic Logotype -->
  <text x="44" y="34" class="brand-text">MOMZ<tspan class="brand-accent">14</tspan></text>
  
  <!-- Architectural Tagline Mark -->
  <text x="46" y="47" class="brand-sub">THE GENESIS OF SOUND FIELDS</text>
</svg>
